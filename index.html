<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master List Calculator</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial, sans-serif; padding: 10px; margin: 0; background: #f4f4f4; }
        .table-container { background: #fff; padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-bottom: 60px; }
        th, td { border: 1px solid #ccc; padding: 6px; text-align: center; font-size: 14px; }
        th { background: #107c41; color: white; }
        input { width: 100%; padding: 4px; box-sizing: border-box; text-align: center; border: 1px solid #ddd; }
        .name-input { text-align: left; }
        .footer-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #107c41; color: white; padding: 12px; text-align: center; font-size: 18px; font-weight: bold; box-shadow: 0 -2px 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="table-container">
    <h2>Master List</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>R</th>
                <th>P</th>
                <th>Amt</th>
            </tr>
        </thead>
        <tbody id="rows-box">
            <!-- Rows will be injected safely -->
        </tbody>
    </table>
</div>

<div class="footer-bar">
    TOTAL: <span id="grand-total">0</span>
</div>

<script>
    const rowCount = 10;
    const tbody = document.getElementById('rows-box');

    // Generate simple rows directly to guarantee it renders on mobile
    let html = '';
    for (let i = 0; i < rowCount; i++) {
        html += `
            <tr>
                <td><input type="text" class="name-input" placeholder="Name ${i+1}"></td>
                <td><input type="number" class="calc-input r-val" oninput="calculateTotal()" placeholder="0"></td>
                <td><input type="number" class="calc-input p-val" oninput="calculateTotal()" placeholder="0"></td>
                <td class="row-amt">0</td>
            </tr>
        `;
    }
    tbody.innerHTML = html;

    function calculateTotal() {
        let rows = tbody.querySelectorAll('tr');
        let grandTotal = 0;

        rows.forEach(row => {
            let r = parseFloat(row.querySelector('.r-val').value) || 0;
            let p = parseFloat(row.querySelector('.p-val').value) || 0;
            let rowSum = r + p; // Adjust calculation math if needed
            row.querySelector('.row-amt').innerText = rowSum;
            grandTotal += rowSum;
        });

        document.getElementById('grand-total').innerText = grandTotal.toLocaleString();
    }
</script>

</body>
</html>
