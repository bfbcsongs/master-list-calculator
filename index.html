<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master List Calculator</title>

<link rel="manifest" href="./manifest.json">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 8px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

h2 {
    text-align: center;
    margin: 4px 0 8px;
    font-size: 20px;
}

.table-wrap {
    width: 100%;
    overflow-x: hidden;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    background: white;
}

th,
td {
    border: 1px solid #999;
    text-align: center;
    padding: 0;
    height: 35px;
}

th {
    background: #ddd;
    font-size: 13px;
}

th.names,
td.names {
    width: 35px;
}

th.qty,
td.qty {
    width: 35px;
}

th.bal,
td.bal {
    width: 40px;
}

th.pay,
td.pay {
    width: 40px;
}

th.amount,
td.amount {
    width: auto;
}

input {
    width: 100%;
    height: 34px;
    border: none;
    outline: none;
    text-align: center;
    font-size: 14px;
    background: transparent;
}

.name-input {
    text-align: left;
}

.amount-cell {
    font-weight: bold;
    font-size: 14px;
    white-space: nowrap;
}

.grand-total {
    margin-top: 8px;
    padding: 10px;
    background: #222;
    color: white;
    text-align: right;
    font-size: 18px;
    font-weight: bold;
}

.bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 52px;
    background: #198754;
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 1000;
    padding: 4px;
}

.bottom-bar button {
    border: none;
    border-radius: 6px;
    background: white;
    color: #222;
    min-width: 48px;
    height: 40px;
    font-size: 16px;
    font-weight: bold;
}

.bottom-bar button:active {
    transform: scale(.95);
}

.admin-panel {
    display: none;
    background: white;
    border: 1px solid #999;
    padding: 10px;
    margin-bottom: 8px;
}

.admin-panel h3 {
    margin: 0 0 8px;
}

.admin-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
}

.admin-row label {
    width: 40px;
    font-weight: bold;
}

.admin-row input {
    border: 1px solid #999;
    height: 32px;
    text-align: left;
    padding: 4px;
}

body {
    padding-bottom: 62px;
}
</style>
</head>

<body>

<h2>MASTER LIST</h2>

<div id="adminPanel" class="admin-panel">
    <h3>Admin Prices</h3>

    <div class="admin-row">
        <label>R</label>
        <input id="priceR" type="number">
    </div>

    <div class="admin-row">
        <label>P</label>
        <input id="priceP" type="number">
    </div>

    <div class="admin-row">
        <label>L</label>
        <input id="priceL" type="number">
    </div>

    <div class="admin-row">
        <label>M</label>
        <input id="priceM" type="number">
    </div>

    <div class="admin-row">
        <label>C</label>
        <input id="priceC" type="number">
    </div>

    <div class="admin-row">
        <label>BO</label>
        <input id="priceBO" type="number">
    </div>

    <button onclick="savePrices()">SAVE PRICES</button>
</div>

<div class="table-wrap">
<table>
    <thead>
        <tr>
            <th class="names" id="namesHeader">Names</th>
            <th class="qty">R</th>
            <th class="qty">P</th>
            <th class="qty">L</th>
            <th class="qty">M</th>
            <th class="qty">C</th>
            <th class="qty">BO</th>
            <th class="bal">Bal</th>
            <th class="pay">Pay</th>
            <th class="amount">Amount</th>
        </tr>
    </thead>

    <tbody id="tableBody"></tbody>
</table>
</div>

<div class="grand-total">
    GRAND TOTAL:
    <span id="grandTotal">0.00</span>
</div>

<div class="bottom-bar">
    <button onclick="clearQuantities()">Clear</button>
    <button onclick="toggleLock()" id="lockButton">🔒</button>
    <button onclick="moveInput('left')">◄</button>
    <button onclick="moveInput('up')">▲</button>
    <button onclick="moveInput('down')">▼</button>
    <button onclick="moveInput('right')">▶</button>
</div>

<script>

const ROWS = 25;

let namesLocked = true;

let prices = JSON.parse(
    localStorage.getItem("master_list_prices") || "{}"
);

const defaultPrices = {
    R: 0,
    P: 0,
    L: 0,
    M: 0,
    C: 0,
    BO: 45
};

prices = {
    ...defaultPrices,
    ...prices
};

let rows = JSON.parse(
    localStorage.getItem("master_list_rows") || "[]"
);

while (rows.length < ROWS) {
    rows.push({
        name: "",
        R: "",
        P: "",
        L: "",
        M: "",
        C: "",
        BO: "",
        Bal: "",
        Pay: ""
    });
}

rows = rows.slice(0, ROWS);

/* Make sure older saved versions receive Bal and Pay */
rows.forEach(row => {
    if (row.Bal === undefined) row.Bal = "";
    if (row.Pay === undefined) row.Pay = "";
});

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function saveRows() {
    localStorage.setItem(
        "master_list_rows",
        JSON.stringify(rows)
    );
}

function calculateBaseAmount(row) {

    let total = 0;

    total += Number(row.R || 0) * Number(prices.R || 0);
    total += Number(row.P || 0) * Number(prices.P || 0);
    total += Number(row.L || 0) * Number(prices.L || 0);
    total += Number(row.M || 0) * Number(prices.M || 0);
    total += Number(row.C || 0) * Number(prices.C || 0);

    /* BO is deducted */
    total -= (Number(row.BO || 0) / 2) * Number(prices.BO || 45);

    return total;
}

function calculateRowAmount(row) {

    const baseAmount = calculateBaseAmount(row);

    const bal = Number(row.Bal || 0);
    const pay = Number(row.Pay || 0);

    /*
       FINAL AMOUNT
       = RPLMCBO calculated amount
       + Bal
       - Pay
    */

    return baseAmount + bal - pay;
}

function formatAmount(value) {
    return Number(value || 0).toFixed(2);
}

function renderTable() {

    const tbody = document.getElementById("tableBody");

    tbody.innerHTML = "";

    rows.forEach((row, index) => {

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td class="names">
                <input
                    class="name-input"
                    data-row="${index}"
                    data-col="0"
                    value="${escapeHtml(row.name)}"
                    ${namesLocked ? "readonly" : ""}
                    onchange="updateName(${index}, this.value)"
                >
            </td>

            <td class="qty">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="1"
                    value="${row.R}"
                    onchange="updateValue(${index}, 'R', this.value)"
                >
            </td>

            <td class="qty">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="2"
                    value="${row.P}"
                    onchange="updateValue(${index}, 'P', this.value)"
                >
            </td>

            <td class="qty">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="3"
                    value="${row.L}"
                    onchange="updateValue(${index}, 'L', this.value)"
                >
            </td>

            <td class="qty">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="4"
                    value="${row.M}"
                    onchange="updateValue(${index}, 'M', this.value)"
                >
            </td>

            <td class="qty">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="5"
                    value="${row.C}"
                    onchange="updateValue(${index}, 'C', this.value)"
                >
            </td>

            <td class="qty">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="6"
                    value="${row.BO}"
                    onchange="updateValue(${index}, 'BO', this.value)"
                >
            </td>

            <td class="bal">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="7"
                    value="${row.Bal}"
                    onchange="updateValue(${index}, 'Bal', this.value)"
                >
            </td>

            <td class="pay">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="8"
                    value="${row.Pay}"
                    onchange="updateValue(${index}, 'Pay', this.value)"
                >
            </td>

            <td class="amount amount-cell" id="amount-${index}">
                ${formatAmount(calculateRowAmount(row))}
            </td>
        `;

        tbody.appendChild(tr);
    });

    updateGrandTotal();
}

function updateName(index, value) {

    rows[index].name = value;

    saveRows();
}

function updateValue(index, field, value) {

    rows[index][field] = value;

    saveRows();

    updateAmount(index);
}

function updateAmount(index) {

    const amount = calculateRowAmount(rows[index]);

    const cell = document.getElementById(
        `amount-${index}`
    );

    if (cell) {
        cell.textContent = formatAmount(amount);
    }

    updateGrandTotal();
}

function updateGrandTotal() {

    let total = 0;

    rows.forEach(row => {
        total += calculateRowAmount(row);
    });

    document.getElementById("grandTotal").textContent =
        formatAmount(total);
}

function clearQuantities() {

    if (!confirm("Clear all quantities, Bal and Pay?")) {
        return;
    }

    rows.forEach(row => {
        row.R = "";
        row.P = "";
        row.L = "";
        row.M = "";
        row.C = "";
        row.BO = "";
        row.Bal = "";
        row.Pay = "";
    });

    saveRows();

    renderTable();
}

function toggleLock() {

    namesLocked = !namesLocked;

    document.getElementById("lockButton").textContent =
        namesLocked ? "🔒" : "🔓";

    renderTable();
}

/* Five taps on Names header opens admin */
let nameHeaderTaps = 0;
let tapTimer = null;

document.getElementById("namesHeader")
    .addEventListener("click", () => {

        nameHeaderTaps++;

        clearTimeout(tapTimer);

        tapTimer = setTimeout(() => {
            nameHeaderTaps = 0;
        }, 1000);

        if (nameHeaderTaps >= 5) {

            nameHeaderTaps = 0;

            const panel =
                document.getElementById("adminPanel");

            panel.style.display =
                panel.style.display === "block"
                    ? "none"
                    : "block";

            loadPrices();
        }
    });

function loadPrices() {

    document.getElementById("priceR").value = prices.R;
    document.getElementById("priceP").value = prices.P;
    document.getElementById("priceL").value = prices.L;

<script>

let categories = [
    { key: 'R', name: 'R', price: 0 },
    { key: 'P', name: 'P', price: 0 },
    { key: 'L', name: 'L', price: 0 },
    { key: 'M', name: 'M', price: 0 },
    { key: 'C', name: 'C', price: 0 },
    { key: 'BO', name: 'BO', price: 0 }
];

let namesLocked = true;

let rows = Array.from(
    { length: 25 },
    () => ({
        name: "",
        values: {
            R: "",
            P: "",
            L: "",
            M: "",
            C: "",
            BO: ""
        },
        pay: "",
        bal: ""
    })
);

let adminClicks = 0;
let clickTimer = null;

function loadSavedData() {

    const savedPrices =
        localStorage.getItem('master_list_prices');

    if (savedPrices) {

        try {

            const parsedPrices =
                JSON.parse(savedPrices);

            categories.forEach(cat => {

                if (parsedPrices[cat.key] !== undefined) {
                    cat.price = parsedPrices[cat.key];
                }

            });

        } catch (e) {
            console.error("Error loading prices", e);
        }

    }

    const savedRows =
        localStorage.getItem('master_list_rows');

    if (savedRows) {

        try {

            const parsedRows =
                JSON.parse(savedRows);

            if (
                Array.isArray(parsedRows) &&
                parsedRows.length === 25
            ) {
                rows = parsedRows;
            }

        } catch (e) {
            console.error("Error loading rows", e);
        }

    }

    /* Add Pay and Bal to older saved rows */
    rows.forEach(row => {

        if (row.pay === undefined) {
            row.pay = "";
        }

        if (row.bal === undefined) {
            row.bal = "";
        }

    });

}

function renderApp() {

    loadSavedData();

    renderPricesConfig();

    renderTableHeaders();

    renderTableBody();

    updateTotals();

}

function renderPricesConfig() {

    const container =
        document.getElementById('prices-config');

    container.innerHTML = '';

    categories.forEach((cat, index) => {

        container.innerHTML += `
            <div class="price-item">

                <label>${cat.name} Price:</label>

                <input
                    type="number"
                    step="any"
                    value="${cat.price === 0 ? '' : cat.price}"
                    oninput="updateCategoryPrice(${index}, this.value)">

            </div>
        `;

    });

}

function renderTableHeaders() {

    const headerRow =
        document.getElementById('header-row');

    let html = `
        <th
            class="name-col"
            id="secretHeader"
            style="cursor:pointer;"
            onclick="handleSecretTap()">
            Names
        </th>
    `;

    categories.forEach(cat => {

        html += `
            <th class="qty-col">
                <span>${cat.name}</span>
            </th>
        `;

    });

    /* PAY = 40px */
    html += `
        <th class="pay-col">
            Pay
        </th>
    `;

    /* BAL = 40px */
    html += `
        <th class="bal-col">
            Bal
        </th>
    `;

    /* AMOUNT = remaining width */
    html += `
        <th class="amount-col">
            Amt
        </th>
    `;

    headerRow.innerHTML = html;

}

function renderTableBody() {

    const tbody =
        document.getElementById('master-body');

    tbody.innerHTML = '';

    rows.forEach((row, rowIndex) => {

        const rowAmount =
            calculateRowAmount(row);

        const tr =
            document.createElement('tr');

        const readonlyAttr =
            namesLocked ? 'readonly' : '';

        let trHtml = `
            <td class="name-cell">

                <input
                    type="text"
                    class="name-input"
                    id="row-${rowIndex}-name"
                    value="${row.name}"
                    ${readonlyAttr}
                    oninput="updateRowName(${rowIndex}, this.value)"
                    placeholder="...">

            </td>
        `;

        categories.forEach((cat, catIndex) => {

            const displayVal =
                row.values[cat.key] === 0 ||
                row.values[cat.key] === ""
                    ? ""
                    : row.values[cat.key];

            trHtml += `
                <td class="qty-cell">

                    <input
                        type="number"
                        class="qty-input"
                        id="row-${rowIndex}-col-${catIndex}"
                        value="${displayVal}"
                        oninput="updateRowValue(${rowIndex}, '${cat.key}', this.value)">

                </td>
            `;

        });

        /* PAY */
        trHtml += `
            <td class="pay-cell">

                <input
                    type="number"
                    class="pay-input"
                    id="row-${rowIndex}-pay"
                    value="${row.pay || ''}"
                    oninput="updatePay(${rowIndex}, this.value)">

            </td>
        `;

        /* BAL */
        trHtml += `
            <td class="bal-cell">

                <input
                    type="number"
                    class="bal-input"
                    id="row-${rowIndex}-bal"
                    value="${row.bal || ''}"
                    oninput="updateBal(${rowIndex}, this.value)">

            </td>
        `;

        /* AMOUNT */
        trHtml += `
            <td
                class="amount-cell"
                id="amt-${rowIndex}">
                ${Math.round(rowAmount).toLocaleString()}
            </td>
        `;

        tr.innerHTML = trHtml;

        tbody.appendChild(tr);

    });

}

function toggleNamesLock() {

    namesLocked = !namesLocked;

    const lockBtn =
        document.getElementById('lockBtn');

    if (namesLocked) {

        lockBtn.innerText = "🔒 Lock";

        lockBtn.classList.remove('unlocked');

    } else {

        lockBtn.innerText = "🔓 Unlock";

        lockBtn.classList.add('unlocked');

    }

    renderTableBody();

}

function calculateRowAmount(row) {

    let otherCategoriesTotal = 0;

    let boValue = 0;

    categories.forEach(cat => {

        const val =
            parseFloat(row.values[cat.key]) || 0;

        if (cat.key === 'BO') {

            boValue =
                (val / 2) * 45;

        } else {

            otherCategoriesTotal +=
                val * cat.price;

        }

    });

    const rplmcboAmount =
        otherCategoriesTotal - boValue;

    const pay =
        parseFloat(row.pay) || 0;

    const bal =
        parseFloat(row.bal) || 0;

    /*
        FINAL AMOUNT
        = RPLMCBO + BAL - PAY
    */

    return rplmcboAmount + bal - pay;

}

function handleSecretTap() {

    adminClicks++;

    clearTimeout(clickTimer);

    clickTimer =
        setTimeout(() => {
            adminClicks = 0;
        }, 600);

    if (adminClicks >= 5) {

        adminClicks = 0;

        toggleAdminMode();

    }

}

function toggleAdminMode() {

    const configBox =
        document.getElementById('configBox');

    configBox.classList.toggle('visible');

}

function updateCategoryPrice(index, value) {

    categories[index].price =
        parseFloat(value) || 0;

    let pricesObj = {};

    categories.forEach(cat => {

        pricesObj[cat.key] =
            cat.price;

    });

    localStorage.setItem(
        'master_list_prices',
        JSON.stringify(pricesObj)
    );

    updateTotals();

}

function saveRowsData() {

    localStorage.setItem(
        'master_list_rows',
        JSON.stringify(rows)
    );

}

function updateRowName(rowIndex, value) {

    rows[rowIndex].name = value;

    saveRowsData();

}

function updateRowValue(
    rowIndex,
    catKey,
    value
) {

    rows[rowIndex].values[catKey] =
        value;

    saveRowsData();

    const rowAmount =
        calculateRowAmount(
            rows[rowIndex]
        );

    document.getElementById(
        `amt-${rowIndex}`
    ).innerText =
        Math.round(rowAmount)
            .toLocaleString();

    updateTotals();

}

function updatePay(rowIndex, value) {

    rows[rowIndex].pay = value;

    saveRowsData();

    updateRowAmount(rowIndex);

}

function updateBal(rowIndex, value) {

    rows[rowIndex].bal = value;

    saveRowsData();

    updateRowAmount(rowIndex);

}

function updateRowAmount(rowIndex) {

    const rowAmount =
        calculateRowAmount(
            rows[rowIndex]
        );

    document.getElementById(
        `amt-${rowIndex}`
    ).innerText =
        Math.round(rowAmount)
            .toLocaleString();

    updateTotals();

}

function updateTotals() {

    let grandTotal = 0;

    rows.forEach(r => {

        grandTotal +=
            calculateRowAmount(r);

    });

    document.getElementById(
        'grand-total'
    ).innerText =
        Math.round(grandTotal)
            .toLocaleString();

}

function clearAllData() {

    if (
        confirm(
            "Are you sure you want to clear all quantities? (Names will be kept)"
        )
    ) {

        rows.forEach(r => {

            r.values = {
                R: "",
                P: "",
                L: "",
                M: "",
                C: "",
                BO: ""
            };

            r.pay = "";
            r.bal = "";

        });

        saveRowsData();

        renderApp();

    }

}
