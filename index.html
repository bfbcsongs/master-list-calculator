<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master List Calculator</title>

<link rel="manifest" href="./manifest.json">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 8px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

h2 {
    text-align: center;
    margin: 4px 0 8px;
    font-size: 20px;
}

.table-wrap {
    width: 100%;
    overflow-x: hidden;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    background: white;
}

th,
td {
    border: 1px solid #999;
    text-align: center;
    padding: 0;
    height: 35px;
}

th {
    background: #ddd;
    font-size: 13px;
}

th.names,
td.names {
    width: 35px;
}

th.qty,
td.qty {
    width: 35px;
}

th.bal,
td.bal {
    width: 40px;
}

th.pay,
td.pay {
    width: 40px;
}

th.amount,
td.amount {
    width: auto;
}

input {
    width: 100%;
    height: 34px;
    border: none;
    outline: none;
    text-align: center;
    font-size: 14px;
    background: transparent;
}

.name-input {
    text-align: left;
}

.amount-cell {
    font-weight: bold;
    font-size: 14px;
    white-space: nowrap;
}

.grand-total {
    margin-top: 8px;
    padding: 10px;
    background: #222;
    color: white;
    text-align: right;
    font-size: 18px;
    font-weight: bold;
}

.bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 52px;
    background: #198754;
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 1000;
    padding: 4px;
}

.bottom-bar button {
    border: none;
    border-radius: 6px;
    background: white;
    color: #222;
    min-width: 48px;
    height: 40px;
    font-size: 16px;
    font-weight: bold;
}

.bottom-bar button:active {
    transform: scale(.95);
}

.admin-panel {
    display: none;
    background: white;
    border: 1px solid #999;
    padding: 10px;
    margin-bottom: 8px;
}

.admin-panel h3 {
    margin: 0 0 8px;
}

.admin-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
}

.admin-row label {
    width: 40px;
    font-weight: bold;
}

.admin-row input {
    border: 1px solid #999;
    height: 32px;
    text-align: left;
    padding: 4px;
}

body {
    padding-bottom: 62px;
}
</style>
</head>

<body>

<h2>MASTER LIST</h2>

<div id="adminPanel" class="admin-panel">
    <h3>Admin Prices</h3>

    <div class="admin-row">
        <label>R</label>
        <input id="priceR" type="number">
    </div>

    <div class="admin-row">
        <label>P</label>
        <input id="priceP" type="number">
    </div>

    <div class="admin-row">
        <label>L</label>
        <input id="priceL" type="number">
    </div>

    <div class="admin-row">
        <label>M</label>
        <input id="priceM" type="number">
    </div>

    <div class="admin-row">
        <label>C</label>
        <input id="priceC" type="number">
    </div>

    <div class="admin-row">
        <label>BO</label>
        <input id="priceBO" type="number">
    </div>

    <button onclick="savePrices()">SAVE PRICES</button>
</div>

<div class="table-wrap">
<table>
    <thead>
        <tr>
            <th class="names" id="namesHeader">Names</th>
            <th class="qty">R</th>
            <th class="qty">P</th>
            <th class="qty">L</th>
            <th class="qty">M</th>
            <th class="qty">C</th>
            <th class="qty">BO</th>
            <th class="bal">Bal</th>
            <th class="pay">Pay</th>
            <th class="amount">Amount</th>
        </tr>
    </thead>

    <tbody id="tableBody"></tbody>
</table>
</div>

<div class="grand-total">
    GRAND TOTAL:
    <span id="grandTotal">0.00</span>
</div>

<div class="bottom-bar">
    <button onclick="clearQuantities()">Clear</button>
    <button onclick="toggleLock()" id="lockButton">🔒</button>
    <button onclick="moveInput('left')">◄</button>
    <button onclick="moveInput('up')">▲</button>
    <button onclick="moveInput('down')">▼</button>
    <button onclick="moveInput('right')">▶</button>
</div>

<script>

const ROWS = 25;

let namesLocked = true;

let prices = JSON.parse(
    localStorage.getItem("master_list_prices") || "{}"
);

const defaultPrices = {
    R: 0,
    P: 0,
    L: 0,
    M: 0,
    C: 0,
    BO: 45
};

prices = {
    ...defaultPrices,
    ...prices
};

let rows = JSON.parse(
    localStorage.getItem("master_list_rows") || "[]"
);

while (rows.length < ROWS) {
    rows.push({
        name: "",
        R: "",
        P: "",
        L: "",
        M: "",
        C: "",
        BO: "",
        Bal: "",
        Pay: ""
    });
}

rows = rows.slice(0, ROWS);

/* Make sure older saved versions receive Bal and Pay */
rows.forEach(row => {
    if (row.Bal === undefined) row.Bal = "";
    if (row.Pay === undefined) row.Pay = "";
});

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function saveRows() {
    localStorage.setItem(
        "master_list_rows",
        JSON.stringify(rows)
    );
}

function calculateBaseAmount(row) {

    let total = 0;

    total += Number(row.R || 0) * Number(prices.R || 0);
    total += Number(row.P || 0) * Number(prices.P || 0);
    total += Number(row.L || 0) * Number(prices.L || 0);
    total += Number(row.M || 0) * Number(prices.M || 0);
    total += Number(row.C || 0) * Number(prices.C || 0);

    /* BO is deducted */
    total -= (Number(row.BO || 0) / 2) * Number(prices.BO || 45);

    return total;
}

function calculateRowAmount(row) {

    const baseAmount = calculateBaseAmount(row);

    const bal = Number(row.Bal || 0);
    const pay = Number(row.Pay || 0);

    /*
       FINAL AMOUNT
       = RPLMCBO calculated amount
       + Bal
       - Pay
    */

    return baseAmount + bal - pay;
}

function formatAmount(value) {
    return Number(value || 0).toFixed(2);
}

function renderTable() {

    const tbody = document.getElementById("tableBody");

    tbody.innerHTML = "";

    rows.forEach((row, index) => {

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td class="names">
                <input
                    class="name-input"
                    data-row="${index}"
                    data-col="0"
                    value="${escapeHtml(row.name)}"
                    ${namesLocked ? "readonly" : ""}
                    onchange="updateName(${index}, this.value)"
                >
            </td>

            <td class="qty">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="1"
                    value="${row.R}"
                    onchange="updateValue(${index}, 'R', this.value)"
                >
            </td>

            <td class="qty">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="2"
                    value="${row.P}"
                    onchange="updateValue(${index}, 'P', this.value)"
                >
            </td>

            <td class="qty">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="3"
                    value="${row.L}"
                    onchange="updateValue(${index}, 'L', this.value)"
                >
            </td>

            <td class="qty">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="4"
                    value="${row.M}"
                    onchange="updateValue(${index}, 'M', this.value)"
                >
            </td>

            <td class="qty">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="5"
                    value="${row.C}"
                    onchange="updateValue(${index}, 'C', this.value)"
                >
            </td>

            <td class="qty">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="6"
                    value="${row.BO}"
                    onchange="updateValue(${index}, 'BO', this.value)"
                >
            </td>

            <td class="bal">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="7"
                    value="${row.Bal}"
                    onchange="updateValue(${index}, 'Bal', this.value)"
                >
            </td>

            <td class="pay">
                <input
                    type="number"
                    inputmode="decimal"
                    data-row="${index}"
                    data-col="8"
                    value="${row.Pay}"
                    onchange="updateValue(${index}, 'Pay', this.value)"
                >
            </td>

            <td class="amount amount-cell" id="amount-${index}">
                ${formatAmount(calculateRowAmount(row))}
            </td>
        `;

        tbody.appendChild(tr);
    });

    updateGrandTotal();
}

function updateName(index, value) {

    rows[index].name = value;

    saveRows();
}

function updateValue(index, field, value) {

    rows[index][field] = value;

    saveRows();

    updateAmount(index);
}

function updateAmount(index) {

    const amount = calculateRowAmount(rows[index]);

    const cell = document.getElementById(
        `amount-${index}`
    );

    if (cell) {
        cell.textContent = formatAmount(amount);
    }

    updateGrandTotal();
}

function updateGrandTotal() {

    let total = 0;

    rows.forEach(row => {
        total += calculateRowAmount(row);
    });

    document.getElementById("grandTotal").textContent =
        formatAmount(total);
}

function clearQuantities() {

    if (!confirm("Clear all quantities, Bal and Pay?")) {
        return;
    }

    rows.forEach(row => {
        row.R = "";
        row.P = "";
        row.L = "";
        row.M = "";
        row.C = "";
        row.BO = "";
        row.Bal = "";
        row.Pay = "";
    });

    saveRows();

    renderTable();
}

function toggleLock() {

    namesLocked = !namesLocked;

    document.getElementById("lockButton").textContent =
        namesLocked ? "🔒" : "🔓";

    renderTable();
}

/* Five taps on Names header opens admin */
let nameHeaderTaps = 0;
let tapTimer = null;

document.getElementById("namesHeader")
    .addEventListener("click", () => {

        nameHeaderTaps++;

        clearTimeout(tapTimer);

        tapTimer = setTimeout(() => {
            nameHeaderTaps = 0;
        }, 1000);

        if (nameHeaderTaps >= 5) {

            nameHeaderTaps = 0;

            const panel =
                document.getElementById("adminPanel");

            panel.style.display =
                panel.style.display === "block"
                    ? "none"
                    : "block";

            loadPrices();
        }
    });

function loadPrices() {

    document.getElementById("priceR").value = prices.R;
    document.getElementById("priceP").value = prices.P;
    document.getElementById("priceL").value = prices.L;
    document.getElementById("priceM").value = prices.M;
    document.getElementById("priceC").value = prices.C;
    document.getElementById("priceBO").value = prices.BO;
}

function savePrices() {

    prices.R =
        Number(document.getElementById("priceR").value || 0);

    prices.P =
        Number(document.getElementById("priceP").value || 0);

    prices.L =
        Number(document.getElementById("priceL").value || 0);

    prices.M =
        Number(document.getElementById("priceM").value || 0);

    prices.C =
        Number(document.getElementById("priceC").value || 0);

    prices.BO =
        Number(document.getElementById("priceBO").value || 45);

    localStorage.setItem(
        "master_list_prices",
        JSON.stringify(prices)
    );

    renderTable();

    alert("Prices saved.");
}

/* Keyboard / arrow navigation */
function moveInput(direction) {

    const active = document.activeElement;

    if (!active || active.tagName !== "INPUT") {
        return;
    }

    const row = Number(active.dataset.row);
    const col = Number(active.dataset.col);

    let newRow = row;
    let newCol = col;

    if (direction === "left") {
        newCol--;
    }

    if (direction === "right") {
        newCol++;
    }

    if (direction === "up") {
        newRow--;
    }

    if (direction === "down") {
        newRow++;
    }

    if (newRow < 0) newRow = 0;
    if (newRow >= ROWS) newRow = ROWS - 1;

    if (newCol < 0) newCol = 0;
    if (newCol > 8) newCol = 8;

    const next =
        document.querySelector(
            `input[data-row="${newRow}"][data-col="${newCol}"]`
        );

    if (next) {
        next.focus();
        next.select();
    }
}

/* Service worker */
if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./sw.js")
            .catch(error => {
                console.log(
                    "Service Worker registration failed:",
                    error
                );
            });

    });
}

renderTable();

</script>

</body>
</html>
